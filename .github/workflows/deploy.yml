name: Render and Deploy Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  render-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Install system dependencies (sf, gdal)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev \
                                   libudunits2-dev libcurl4-openssl-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ hashFiles('DESCRIPTION') }}-${{ runner.os }}
          restore-keys: r-

      - name: Install R packages
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "here", "sf", "geodata", "dplyr", "tidyr", "readr", "purrr",
            "stringr", "spdep", "spatialreg", "leaflet", "leaflet.extras",
            "plotly", "DT", "ggplot2", "scales", "RColorBrewer", "viridis",
            "glue", "data.table", "arrow", "psych", "htmltools", "knitr"
          )
          install.packages(pkgs, repos = "https://cloud.r-project.org")

      - name: Render Quarto site
        # Output goes to docs/ which is what GitHub Pages serves
        # NOTE: Heavy spatial data (RDS outputs) must be committed to the repo
        #       OR fetched via DVC/release assets. See DATA_SETUP.md.
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
