project:
  type: website
  output-dir: docs   # GitHub Pages reads from /docs on main branch

website:
  title: "Peace Atlas · PDET Colombia"
  description: "Exploratory spatial analysis of peace indicators across Colombia's PDET municipalities · GEOG 560 · Spring 2026"
  favicon: "assets/favicon.ico"
  navbar:
    background: "#1a2e44"
    foreground: light
    logo: "assets/logo.svg"
    left:
      - href: index.qmd
        text: "Overview"
      - href: panel1_atlas.qmd
        text: "Panel 1 · Variable Atlas"
      - href: descriptives.qmd
        text: "Descriptives"
      - href: panel2_bivariate.qmd
        text: "Panel 2 · Bivariate & Spatial"
      - href: panel3_regression.qmd
        text: "Panel 3 · Regression Models"
      - href: explorer.qmd
        text: "Explorer"
      - href: audit.qmd
        text: "Data Audit"
      - href: codebook.qmd
        text: "Codebook"
    right:
      - icon: github
        href: "https://github.com/ccaveros/peace_atlas"
        aria-label: GitHub

  page-footer:
    background: "#1a2e44"
    foreground: light
    left: "Cecilia Cavero-Sanchez · Penn State Political Science & Social Data Analytics"
    right: "GEOG 560 Spatial Regression · Spring 2026"

  open-graph:
    title: "Peace Atlas · PDET Colombia"
    description: "Spatial analysis of peace indicators in post-conflict Colombia"

format:
  html:
    theme: [cosmo, assets/custom.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: true
    code-summary: "Show code"
    code-tools: true
    fig-align: center
    fig-dpi: 150
    embed-resources: false   # keep site files separate (faster GitHub Pages)
    smooth-scroll: true
    anchor-sections: true
    df-print: paged

execute:
  freeze: auto        # re-render only when source changes
  cache: true         # cache heavy spatial computations
  warning: false
  message: false
  isolate: true

editor: visual
